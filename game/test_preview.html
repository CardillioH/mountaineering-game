<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Preview Level 1 - Ice Cave & Ice Wall</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0b1017; }
    #screen-platformer { display:flex !important; width:100vw; height:100vh; }
    .platformer-viewport { width:100vw; height:100vh; position:relative; }
  </style>
</head>
<body>
<div id="screen-platformer" class="screen-view active">
  <div class="platformer-viewport" id="platformer-viewport">
    <canvas id="platformer-canvas"></canvas>
    
    <!-- Интерактивный диалог -->
    <div class="level-dialog-overlay" id="level-dialog-overlay">
      <div class="level-dialog-card">
        <div class="dialog-card-header">
          <span class="dialog-card-tag" id="dialog-card-tag">ШТУРМОВОЙ РУБЕЖ</span>
          <span class="dialog-card-badge" id="dialog-card-badge">3 800 М</span>
        </div>
        <div class="dialog-card-body">
          <div class="dialog-speaker-avatar" id="dialog-speaker-avatar">⛏️</div>
          <div class="dialog-card-content">
            <h3 class="dialog-card-title" id="dialog-card-title">ШТУРМОВАЯ ЛЕДОВАЯ СТЕНА</h3>
            <div class="dialog-card-subtitle" id="dialog-card-subtitle">Снаряжение проверено</div>
            <div class="dialog-card-text" id="dialog-card-text"></div>
          </div>
        </div>
        <div class="dialog-card-actions" id="dialog-card-actions">
          <button class="btn-dialog-back" id="btn-dialog-back" style="display: none;">ОТСТУПИТЬ К ТРОПЕ [ESC]</button>
          <button class="btn-dialog-camp" id="btn-dialog-camp" style="display: none;">← В БАЗОВЫЙ ЛАГЕРЬ ЗА СНАРЯЖЕНИЕМ</button>
          <div class="btn-climb-guard" id="btn-climb-guard" style="display: inline-block;">
            <button class="btn-dialog-close" id="btn-dialog-close">НАЧАТЬ ВОСХОЖДЕНИЕ НА ЛЕДЯНУЮ СТЕНУ →</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Заглушки для элементов HUD -->
    <div id="inv-slots-row" style="display:none;"></div>
    <div id="inv-weight-tag" style="display:none;"></div>
    <div id="game-over-overlay" style="display:none;"></div>
    <div id="comic-dialog-overlay" style="display:none;"></div>

    <!-- ВИРТУАЛЬНЫЙ СЕНСОРНЫЙ ГЕЙМПАД ДЛЯ СМАРТФОНОВ -->
    <div class="mobile-controls-overlay" id="mobile-controls-overlay">
      <div class="touch-cluster touch-cluster-left">
        <button class="touch-btn touch-btn-dir" id="touch-btn-left" aria-label="Бег влево">
          <span class="touch-icon">◀</span>
          <span class="touch-lbl">ВЛЕВО</span>
        </button>
        <button class="touch-btn touch-btn-dir" id="touch-btn-right" aria-label="Бег вправо">
          <span class="touch-icon">▶</span>
          <span class="touch-lbl">ВПРАВО</span>
        </button>
      </div>
      <div class="touch-cluster touch-cluster-right">
        <button class="touch-btn touch-btn-action touch-btn-interact" id="touch-btn-interact" aria-label="Действие [E]">
          <span class="touch-icon">🖐</span>
          <span class="touch-lbl">ДЕЙСТВИЕ</span>
        </button>
        <button class="touch-btn touch-btn-action touch-btn-jump" id="touch-btn-jump" aria-label="Прыжок">
          <span class="touch-icon">▲</span>
          <span class="touch-lbl">ПРЫЖОК</span>
        </button>
      </div>
    </div>
  </div>
</div>

<script src="level1.js"></script>
<script>
window.addEventListener("load", () => {
  const params = new URLSearchParams(window.location.search);
  if (params.get("mobile") === "1") {
    document.body.classList.add("is-mobile-device");
    window.isMobileDevice = true;
  }

  const p = new Level1Platformer("platformer-canvas");
  window.testP = p;
  
  // Check URL params for preview position and gear
  const params = new URLSearchParams(window.location.search);
  const gearParam = params.get("gear");
  if (gearParam === "none") {
    p.setPackedGear([], [], 0);
  } else if (gearParam === "no_axe") {
    p.setPackedGear(["crampons"], [], 3.0);
  } else {
    p.setPackedGear(["crampons", "ice_axe", "downsuit", "thermos"], [], 9.8);
  }
  p.resizeCanvas();

  // Check URL params for preview position
  const viewMode = params.get("view") || "cave";

  if (viewMode === "start") {
    // Start of level (Base Camp)
    p.player.x = 100;
    p.player.y = 530 - p.player.h;
    p.camera.x = 0;
  } else if (viewMode === "mid") {
    // Ridge transition (Platform 3 / 4)
    p.player.x = 1650;
    p.player.y = 415 - p.player.h;
    p.camera.x = 1000;
  } else {
    // Platform 5 (Ice cave and ice wall)
    p.player.x = 2330;
    p.player.y = 505 - p.player.h;
    p.camera.x = 1320;
  }

  p.player.grounded = true;
  p.start();

  if (params.get("dialog") === "1") {
    p.activeInteract = p.interactives.find(it => it.id === "ice_wall");
    p.openIceWallDialog();
  } else {
    p.activeInteract = p.interactives.find(it => it.id === "ice_wall");
  }
});
</script>
</body>
</html>
